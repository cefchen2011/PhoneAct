# 说明：org.gradle.java.home 属于本机配置，请放到用户级
#   ~/.gradle/gradle.properties（Windows: %USERPROFILE%\.gradle\gradle.properties）
# 需要 JDK 17 或 21（AGP 8.9 不支持 JDK 25），例如：
#   org.gradle.java.home=C:\\path\\to\\jdk21

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 依赖下载超时（直连官方源时容易被网络挂起）
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# 受限网络下 Kotlin 编译守护进程可能连不上，直接在 Gradle 进程内编译更稳
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2048m
